spring.application.name=AccountService
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/account_service
spring.datasource.username=postgres
spring.datasource.password=laith7525
spring.datasource.driver-class-name=org.postgresql.Driver

#Spring JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

#Artemis
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=admin
spring.artemis.password=admin

#Customer Service
customer-service.url=http://localhost:8000

#Queue Names
process-transfer-queue=process-transfer
transfer-completed-queue=transfer-completed
transfer-failed-queue=transfer-failed